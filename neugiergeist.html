<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Neugiergeist">
<title>Neugiergeist</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 380 380'%3E%3Crect width='380' height='380' rx='72' fill='%23f5f0e8'/%3E%3Cellipse cx='190' cy='155' rx='68' ry='58' fill='%23c8571a' opacity='.12'/%3E%3Cpath d='M150 175 C130 165 118 148 120 128 C122 105 142 90 162 92 C168 82 180 76 193 78 C206 80 215 90 215 102 C228 102 238 113 236 126 C234 140 222 148 210 146 L210 175 Z' fill='none' stroke='%231a1a18' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cline x1='167' y1='100' x2='167' y2='175' stroke='%231a1a18' stroke-width='2' opacity='.3'/%3E%3Cline x1='183' y1='92' x2='183' y2='175' stroke='%231a1a18' stroke-width='2' opacity='.3'/%3E%3Cline x1='199' y1='95' x2='199' y2='175' stroke='%231a1a18' stroke-width='2' opacity='.3'/%3E%3Cpath d='M150 175 L210 175' stroke='%231a1a18' stroke-width='2.5' stroke-linecap='round'/%3E%3Crect x='164' y='180' width='32' height='52' rx='16' fill='%23c8571a'/%3E%3Cpath d='M148 212 C148 228 152 238 162 244 C168 248 172 250 180 250 C188 250 192 248 198 244 C208 238 212 228 212 212' fill='none' stroke='%231a1a18' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='180' y1='250' x2='180' y2='268' stroke='%231a1a18' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M163 268 L197 268' stroke='%231a1a18' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='152' cy='128' r='5' fill='%23c8571a'/%3E%3Ccircle cx='215' cy='120' r='4.5' fill='%23c8571a' opacity='.8'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 380 380'%3E%3Crect width='380' height='380' rx='72' fill='%23f5f0e8'/%3E%3Cellipse cx='190' cy='155' rx='68' ry='58' fill='%23c8571a' opacity='.12'/%3E%3Cpath d='M150 175 C130 165 118 148 120 128 C122 105 142 90 162 92 C168 82 180 76 193 78 C206 80 215 90 215 102 C228 102 238 113 236 126 C234 140 222 148 210 146 L210 175 Z' fill='none' stroke='%231a1a18' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cline x1='167' y1='100' x2='167' y2='175' stroke='%231a1a18' stroke-width='2' opacity='.3'/%3E%3Cline x1='183' y1='92' x2='183' y2='175' stroke='%231a1a18' stroke-width='2' opacity='.3'/%3E%3Cline x1='199' y1='95' x2='199' y2='175' stroke='%231a1a18' stroke-width='2' opacity='.3'/%3E%3Cpath d='M150 175 L210 175' stroke='%231a1a18' stroke-width='2.5' stroke-linecap='round'/%3E%3Crect x='164' y='180' width='32' height='52' rx='16' fill='%23c8571a'/%3E%3Cpath d='M148 212 C148 228 152 238 162 244 C168 248 172 250 180 250 C188 250 192 248 198 244 C208 238 212 228 212 212' fill='none' stroke='%231a1a18' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='180' y1='250' x2='180' y2='268' stroke='%231a1a18' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M163 268 L197 268' stroke='%231a1a18' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='152' cy='128' r='5' fill='%23c8571a'/%3E%3Ccircle cx='215' cy='120' r='4.5' fill='%23c8571a' opacity='.8'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --ink: #1a1a18;
    --paper: #f5f0e8;
    --accent: #c8571a;
    --muted: #8a8478;
    --surface: #ede8de;
    --border: #d4cec2;
    --green: #4a7c59;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 3rem;
    max-width: 480px;
    margin: 0 auto;
  }

  .header { text-align: center; margin-bottom: 2rem; }

  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2.2rem, 10vw, 3rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .header h1 em { font-style: italic; color: var(--accent); }

  .header p {
    margin-top: 0.4rem;
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: 300;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .platform-badge {
    margin-top: 0.3rem;
    font-size: 0.68rem;
    color: var(--muted);
    opacity: 0.7;
  }

  .card {
    width: 100%;
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.2rem;
    margin-bottom: 1rem;
  }

  .card label {
    display: block;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .api-row { display: flex; gap: 8px; }

  input[type="password"], input[type="text"] {
    flex: 1;
    padding: 0.65rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    background: var(--paper);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  input:focus { border-color: var(--accent); }

  .btn {
    padding: 0.65rem 1rem;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }

  .btn:active { background: var(--accent); }

  .key-status { margin-top: 0.5rem; font-size: 0.75rem; color: var(--muted); }
  .key-status.ok { color: var(--green); }

  .conversation {
    width: 100%;
    min-height: 260px;
    max-height: 42vh;
    overflow-y: auto;
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1rem;
    margin-bottom: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    -webkit-overflow-scrolling: touch;
  }

  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .empty-state p {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
  }

  .msg { display: flex; flex-direction: column; gap: 0.2rem; }

  .msg-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .msg.user .msg-label { text-align: right; color: var(--accent); }

  .msg-bubble {
    background: var(--surface);
    border-radius: 10px 10px 10px 2px;
    padding: 0.7rem 0.9rem;
    font-size: 0.9rem;
    line-height: 1.55;
    max-width: 90%;
  }

  .msg.user .msg-bubble {
    background: var(--ink);
    color: var(--paper);
    border-radius: 10px 10px 2px 10px;
    align-self: flex-end;
  }

  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8rem;
    margin-top: 0.5rem;
  }

  .mic-btn {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    position: relative;
  }

  .mic-btn:active { transform: scale(0.95); }

  .mic-btn.listening {
    border-color: var(--accent);
    background: var(--accent);
    animation: pulse 1.5s ease-in-out infinite;
  }

  .mic-btn.speaking {
    border-color: var(--green);
    background: var(--green);
  }

  .mic-btn.thinking {
    border-color: var(--muted);
    background: var(--surface);
  }

  /* Countdown ring overlay */
  .countdown-ring {
    position: absolute;
    top: -6px; left: -6px;
    width: 100px; height: 100px;
    pointer-events: none;
    display: none;
  }

  .countdown-ring.visible { display: block; }

  .countdown-ring circle {
    fill: none;
    stroke: var(--accent);
    stroke-width: 3;
    stroke-dasharray: 283;
    stroke-dashoffset: 283;
    stroke-linecap: round;
    transform-origin: center;
    transform: rotate(-90deg);
    transition: stroke-dashoffset 0.1s linear;
  }

  .mic-icon { width: 30px; height: 30px; fill: var(--ink); transition: fill 0.2s; }
  .mic-btn.listening .mic-icon,
  .mic-btn.speaking .mic-icon { fill: white; }

  .thinking-icon { display: none; }
  .mic-btn.thinking .mic-icon { display: none; }
  .mic-btn.thinking .thinking-icon { display: flex; gap: 4px; align-items: center; }
  .thinking-icon span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite;
  }
  .thinking-icon span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-icon span:nth-child(3) { animation-delay: 0.4s; }

  .status-text {
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    min-height: 1.2em;
    text-align: center;
  }

  .status-text.active { color: var(--accent); }
  .status-text.speaking { color: var(--green); }

  .stop-btn {
    padding: 0.4rem 1.4rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    display: none;
    touch-action: manipulation;
  }

  .stop-btn.visible { display: block; }
  .stop-btn:active { color: var(--accent); border-color: var(--accent); }

  .error-box {
    width: 100%;
    background: #fef2f0;
    border: 1px solid #f5c6bb;
    border-radius: 10px;
    padding: 0.75rem 1rem;
    font-size: 0.82rem;
    color: var(--accent);
    display: none;
    margin-bottom: 0.5rem;
    line-height: 1.5;
  }

  .error-box.visible { display: block; }

  .settings-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-top: 0.5rem;
  }

  .settings-row label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    white-space: nowrap;
  }

  .speed-slider {
    flex: 1;
    -webkit-appearance: none;
    height: 3px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
  }

  .speed-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--ink);
    cursor: pointer;
  }

  .speed-val {
    font-size: 0.78rem;
    color: var(--ink);
    font-weight: 500;
    min-width: 2.5rem;
    text-align: right;
  }

  /* Silence timeout selector */
  .silence-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-top: 0.2rem;
  }

  .silence-row label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    white-space: nowrap;
  }

  .silence-row select {
    flex: 1;
    padding: 0.3rem 0.5rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    background: var(--paper);
    color: var(--ink);
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
  }

  .memory-badge {
    font-size: 0.7rem;
    color: var(--green);
    text-align: center;
    margin-top: 0.3rem;
  }

  .archive-btn {
    margin-top: 0.3rem;
    padding: 0.5rem 1.4rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    touch-action: manipulation;
    display: none;
  }

  .archive-btn.visible { display: block; }
  .archive-btn:active { color: var(--accent); border-color: var(--accent); }
  .archive-btn.loading { opacity: 0.6; pointer-events: none; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(200,87,26,0.3); }
    50% { box-shadow: 0 0 0 14px rgba(200,87,26,0); }
  }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Neugier<em>geist</em></h1>
  <p>Dein deutschsprachiger Gesprächspartner</p>
  <div class="platform-badge" id="platformBadge"></div>
</div>

<div class="card" id="apiSetup">
  <label>Anthropic API Key</label>
  <div class="api-row">
    <input type="password" id="apiKey" placeholder="sk-ant-..." />
    <button class="btn" onclick="saveKey()">Speichern</button>
  </div>
  <div class="key-status" id="keyStatus">Kein Key gespeichert</div>
</div>

<div class="conversation" id="conversation">
  <div class="empty-state" id="emptyState">
    <p>Drücke den Knopf<br>und beginne zu sprechen.</p>
  </div>
</div>

<div class="error-box" id="errorBox"></div>

<div class="controls">
  <button class="mic-btn" id="micBtn" onclick="toggleListening()">
    <svg class="countdown-ring" id="countdownRing" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" id="countdownCircle"/>
    </svg>
    <svg class="mic-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm6 9a1 1 0 0 1 2 0 8 8 0 0 1-7 7.93V20h2a1 1 0 0 1 0 2H9a1 1 0 0 1 0-2h2v-2.07A8 8 0 0 1 4 10a1 1 0 0 1 2 0 6 6 0 0 0 12 0z"/>
    </svg>
    <div class="thinking-icon">
      <span></span><span></span><span></span>
    </div>
  </button>
  <div class="status-text" id="statusText">Bereit</div>
  <button class="stop-btn" id="stopBtn" onclick="stopSpeaking()">Stopp</button>

  <div class="settings-row">
    <label>Tempo</label>
    <input type="range" class="speed-slider" id="speedSlider" min="0.6" max="1.8" step="0.1" value="1.0" oninput="updateSpeed(this.value)">
    <span class="speed-val" id="speedVal">1.0×</span>
  </div>

  <div class="silence-row">
    <label>Pause</label>
    <select id="silenceSelect" onchange="updateSilenceTimeout(this.value)">
      <option value="3000">3 Sekunden</option>
      <option value="5000" selected>5 Sekunden</option>
      <option value="7000">7 Sekunden</option>
      <option value="10000">10 Sekunden</option>
    </select>
  </div>

  <div class="memory-badge" id="memoryBadge"></div>
  <button class="archive-btn" id="archiveBtn" onclick="archiveConversation()">✦ In Claude archivieren</button>
</div>

<script>
// ── Platform Detection ──────────────────────────────────────────────────────
const IS_ANDROID = /Android/i.test(navigator.userAgent);
const IS_IOS = /iPad|iPhone|iPod/i.test(navigator.userAgent);
const IS_MOBILE = IS_ANDROID || IS_IOS;

document.getElementById('platformBadge').textContent =
  IS_ANDROID ? '📱 Android-Modus' : IS_IOS ? '📱 iOS-Modus' : '🖥 Desktop-Modus';

// ── Config ──────────────────────────────────────────────────────────────────
const SYSTEM_PROMPT = `Du bist ein neugieriger, intelligenter Gesprächspartner. Du sprichst ausschließlich Deutsch.
Dein Ziel ist es, dem Nutzer dabei zu helfen, sein Allgemeinwissen zu erweitern — durch lebhafte, informative Gespräche über Naturwissenschaften, Geschichte, Philosophie, Wirtschaft und alles dazwischen.
Halte deine Antworten gesprächig und prägnant (2-4 Sätze), damit sie sich gut zum Vorlesen eignen.
Stelle am Ende oft eine Gegenfrage, um das Gespräch in Gang zu halten.
Sei direkt, präzise und zeige echte Begeisterung für Ideen.
Wenn du Websuchen verwendest, nenne KEINE Quellen oder Zitate — integriere die Information direkt in deine Antwort.`;

const MAX_HISTORY = 20;
const CIRCUMFERENCE = 2 * Math.PI * 45; // ≈ 283 for r=45

// ── State ───────────────────────────────────────────────────────────────────
let apiKey = localStorage.getItem('ng_key') || '';
let messages = JSON.parse(localStorage.getItem('ng_history') || '[]');
let recognition = null;
let isListening = false;
let isSpeaking = false;
let currentUtterance = null;
let speechRate = parseFloat(localStorage.getItem('ng_speed') || '1.0');
let silenceTimeout = parseInt(localStorage.getItem('ng_silence') || '5000');
let silenceTimer = null;
let countdownInterval = null;
let lastSpeechTime = 0;
const synth = window.speechSynthesis;

// ── Init ────────────────────────────────────────────────────────────────────
window.onload = () => {
  if (apiKey) {
    document.getElementById('keyStatus').textContent = '✓ Key geladen';
    document.getElementById('keyStatus').className = 'key-status ok';
  }
  const slider = document.getElementById('speedSlider');
  slider.value = speechRate;
  document.getElementById('speedVal').textContent = speechRate.toFixed(1) + '×';

  const sel = document.getElementById('silenceSelect');
  sel.value = silenceTimeout;

  if (messages.length > 0) {
    messages.forEach(m => {
      const text = Array.isArray(m.content)
        ? m.content.filter(b => b.type === 'text').map(b => b.text).join(' ')
        : m.content;
      addMsg(m.role, text);
    });
    updateMemoryBadge();
  }
  synth.getVoices();
};

// ── Settings ─────────────────────────────────────────────────────────────────
function updateSpeed(val) {
  speechRate = parseFloat(val);
  localStorage.setItem('ng_speed', speechRate);
  document.getElementById('speedVal').textContent = speechRate.toFixed(1) + '×';
}

function updateSilenceTimeout(val) {
  silenceTimeout = parseInt(val);
  localStorage.setItem('ng_silence', silenceTimeout);
}

// ── Memory ───────────────────────────────────────────────────────────────────
function updateMemoryBadge() {
  const count = Math.floor(messages.length / 2);
  document.getElementById('memoryBadge').textContent = count > 0 ? `${count} Gespräche gespeichert` : '';
  if (messages.length >= 2) document.getElementById('archiveBtn').classList.add('visible');
}

function saveHistory() {
  messages = messages.slice(-MAX_HISTORY);
  localStorage.setItem('ng_history', JSON.stringify(messages));
  updateMemoryBadge();
}

// ── Key ──────────────────────────────────────────────────────────────────────
function saveKey() {
  const val = document.getElementById('apiKey').value.trim();
  if (!val.startsWith('sk-')) {
    showError('Bitte einen gültigen Anthropic API Key eingeben (beginnt mit sk-ant-)');
    return;
  }
  apiKey = val;
  localStorage.setItem('ng_key', val);
  document.getElementById('keyStatus').textContent = '✓ Key gespeichert';
  document.getElementById('keyStatus').className = 'key-status ok';
  document.getElementById('apiKey').value = '';
  hideError();
}

// ── Countdown Ring ────────────────────────────────────────────────────────────
function startCountdownRing(durationMs) {
  const ring = document.getElementById('countdownRing');
  const circle = document.getElementById('countdownCircle');
  ring.classList.add('visible');
  circle.style.strokeDasharray = CIRCUMFERENCE;
  circle.style.strokeDashoffset = CIRCUMFERENCE;

  const startTime = Date.now();
  countdownInterval = setInterval(() => {
    const elapsed = Date.now() - startTime;
    const progress = Math.min(elapsed / durationMs, 1);
    circle.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);
    if (progress >= 1) stopCountdownRing();
  }, 50);
}

function stopCountdownRing() {
  clearInterval(countdownInterval);
  countdownInterval = null;
  const ring = document.getElementById('countdownRing');
  const circle = document.getElementById('countdownCircle');
  ring.classList.remove('visible');
  circle.style.strokeDashoffset = CIRCUMFERENCE;
}

// ── Silence Detection ─────────────────────────────────────────────────────────
function resetSilenceTimer() {
  clearTimeout(silenceTimer);
  stopCountdownRing();
}

function armSilenceTimer() {
  resetSilenceTimer();
  startCountdownRing(silenceTimeout);
  silenceTimer = setTimeout(() => {
    if (isListening && recognition) {
      recognition.stop(); // triggers onresult or onend
    }
  }, silenceTimeout);
}

// ── Mic Control ──────────────────────────────────────────────────────────────
function toggleListening() {
  if (isSpeaking) { stopSpeaking(); return; }
  if (!apiKey) { showError('Bitte zuerst deinen Anthropic API Key eingeben.'); return; }
  if (isListening) {
    resetSilenceTimer();
    recognition && recognition.stop();
    isListening = false;
    setMic('idle');
    setStatus('Bereit', '');
    return;
  }
  startListening();
}

function startListening() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showError('Web Speech API nicht unterstützt. Bitte Chrome verwenden.');
    return;
  }

  recognition = new SR();
  recognition.lang = 'de-DE';
  recognition.interimResults = true; // needed for speech activity detection
  recognition.maxAlternatives = 1;
  recognition.continuous = false;

  recognition.onstart = () => {
    isListening = true;
    setMic('listening');
    setStatus('Höre zu…', 'active');
    hideError();
    armSilenceTimer(); // start countdown immediately on mic open
  };

  // Reset timer whenever speech is detected (interim results)
  recognition.onspeechstart = () => {
    resetSilenceTimer(); // speech started, cancel countdown
  };

  recognition.onspeechend = () => {
    // Speech stopped — arm the silence timer now
    armSilenceTimer();
  };

  recognition.onresult = (e) => {
    // Reset timer on any interim result (user is speaking)
    const isFinal = e.results[e.results.length - 1].isFinal;
    if (!isFinal) {
      resetSilenceTimer();
      return; // wait for final result
    }
    const text = e.results[e.results.length - 1][0].transcript.trim();
    if (!text) return;
    resetSilenceTimer();
    isListening = false;
    addMsg('user', text);
    setMic('thinking');
    setStatus('Denkt nach…', '');
    askClaude(text);
  };

  recognition.onerror = (e) => {
    resetSilenceTimer();
    isListening = false;
    setMic('idle');
    if (e.error === 'not-allowed') {
      showError('Mikrofon-Zugriff verweigert. Tippe oben in Chrome auf das Symbol links neben der URL → Mikrofon → Erlauben.');
    } else if (e.error === 'no-speech') {
      setStatus('Bereit', '');
    } else {
      showError('Fehler: ' + e.error);
    }
  };

  recognition.onend = () => {
    resetSilenceTimer();
    // If ended without a result (e.g. only silence), just reset
    if (isListening) {
      isListening = false;
      setMic('idle');
      setStatus('Bereit', '');
    }
  };

  try { recognition.start(); }
  catch(e) { showError('Mikrofon konnte nicht gestartet werden: ' + e.message); }
}

// ── Claude API ────────────────────────────────────────────────────────────────
async function askClaude(userText) {
  messages.push({ role: 'user', content: userText });
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 600,
        system: SYSTEM_PROMPT,
        tools: [{ type: 'web_search_20250305', name: 'web_search', max_uses: 3 }],
        messages: messages
      })
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || 'API Fehler ' + res.status);
    }
    const data = await res.json();
    const reply = data.content
      .filter(b => b.type === 'text')
      .map(b => b.text)
      .join(' ')
      .trim();
    messages.push({ role: 'assistant', content: data.content });
    saveHistory();
    addMsg('assistant', reply);
    speak(reply);
  } catch(e) {
    setMic('idle');
    setStatus('Bereit', '');
    showError('Fehler: ' + e.message);
  }
}

// ── TTS ───────────────────────────────────────────────────────────────────────
function speak(text) {
  // Platform-aware stop
  if (IS_MOBILE) {
    synth.cancel();
  } else {
    synth.cancel(); // also cancel on desktop; pause() only useful mid-utterance
  }

  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'de-DE';
  utt.rate = speechRate;
  utt.pitch = 1.0;

  const loadVoiceAndSpeak = () => {
    const voices = synth.getVoices();
    // Desktop (Edge): prefer natural/neural voices
    let voice = null;
    if (!IS_MOBILE) {
      voice = voices.find(v => v.lang.startsWith('de') && v.name.toLowerCase().includes('neural'))
           || voices.find(v => v.lang.startsWith('de') && !v.localService) // online = higher quality on Edge
           || voices.find(v => v.lang.startsWith('de'));
    } else {
      voice = voices.find(v => v.lang.startsWith('de') && v.localService)
           || voices.find(v => v.lang.startsWith('de'));
    }
    if (voice) utt.voice = voice;

    utt.onstart = () => {
      isSpeaking = true;
      setMic('speaking');
      setStatus('Spricht…', 'speaking');
      document.getElementById('stopBtn').classList.add('visible');
    };

    utt.onend = () => {
      isSpeaking = false;
      document.getElementById('stopBtn').classList.remove('visible');
      // Auto-restart listening after response
      setTimeout(() => startListening(), IS_MOBILE ? 600 : 400);
    };

    utt.onerror = (e) => {
      // 'interrupted' is expected when cancel() is called — not a real error
      if (e.error === 'interrupted' || e.error === 'canceled') {
        isSpeaking = false;
        document.getElementById('stopBtn').classList.remove('visible');
        return;
      }
      isSpeaking = false;
      setMic('idle');
      setStatus('Bereit', '');
      document.getElementById('stopBtn').classList.remove('visible');
    };

    currentUtterance = utt;
    synth.speak(utt);
  };

  // Voices may not be loaded yet on first run
  if (synth.getVoices().length > 0) {
    loadVoiceAndSpeak();
  } else {
    synth.onvoiceschanged = () => {
      synth.onvoiceschanged = null;
      loadVoiceAndSpeak();
    };
  }
}

function stopSpeaking() {
  if (IS_MOBILE) {
    synth.cancel();
  } else {
    synth.cancel();
  }
  isSpeaking = false;
  setMic('idle');
  setStatus('Bereit', '');
  document.getElementById('stopBtn').classList.remove('visible');
}

// ── Archive ───────────────────────────────────────────────────────────────────
async function archiveConversation() {
  const btn = document.getElementById('archiveBtn');
  btn.textContent = '⏳ Zusammenfassung wird erstellt…';
  btn.classList.add('loading');
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 600,
        messages: [
          ...messages,
          { role: 'user', content: 'Bitte fasse unser heutiges Gespräch in 3-5 Sätzen zusammen. Beginne mit "Gesprächsarchiv Neugiergeist:" und nenne die wichtigsten Themen und Erkenntnisse. Schreibe auf Deutsch.' }
        ]
      })
    });
    const data = await res.json();
    const summary = data.content[0].text;
    await navigator.clipboard.writeText(summary);
    btn.textContent = '✓ Kopiert — Archiv öffnet sich…';
    setTimeout(() => window.open('https://claude.ai/chat/36e30c18-9d28-438c-a143-78f8cc15cee0', '_blank'), 800);
  } catch(e) {
    showError('Archivierung fehlgeschlagen: ' + e.message);
  }
  btn.textContent = '✦ In Claude archivieren';
  btn.classList.remove('loading');
}

// ── UI Helpers ────────────────────────────────────────────────────────────────
function addMsg(role, text) {
  const conv = document.getElementById('conversation');
  const empty = document.getElementById('emptyState');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="msg-label">${role === 'user' ? 'Du' : 'Neugiergeist'}</div>
    <div class="msg-bubble">${text}</div>`;
  conv.appendChild(div);
  conv.scrollTop = conv.scrollHeight;
}

function setMic(state) {
  document.getElementById('micBtn').className = 'mic-btn' + (state !== 'idle' ? ' ' + state : '');
}

function setStatus(text, cls) {
  const el = document.getElementById('statusText');
  el.textContent = text;
  el.className = 'status-text' + (cls ? ' ' + cls : '');
}

function showError(msg) {
  const el = document.getElementById('errorBox');
  el.textContent = msg;
  el.classList.add('visible');
}

function hideError() {
  document.getElementById('errorBox').classList.remove('visible');
}
</script>
